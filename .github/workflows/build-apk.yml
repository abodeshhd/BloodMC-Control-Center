
name: BloodMC Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Find Android Project
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100

          if [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f BloodMC_Monitor_Android/gradlew ]; then
            echo "PROJECT_DIR=BloodMC_Monitor_Android" >> "$GITHUB_ENV"
          else
            echo "No Gradle project found."
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloodMC-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
